[project]
name = "model-compression"
version = "0.1.0"
description = "Frozen-weight channel compression experiments with Qwen3"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=5.0,<6",
    "accelerate>=1.6,<2",
    # Current Colab images ship Gradio/Diffusers versions that require Hub 1.x.
    "huggingface-hub>=1.23,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
data = ["pyarrow>=19,<22"]
dev = ["pytest>=9,<10"]

[project.scripts]
qwen = "model_compression.qwen:main"
model-compression = "model_compression.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
